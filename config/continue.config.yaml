name: Local Code Autocomplete
version: 1.0.0
schema: v1

models:
  - name: Qwen Coder 1.5B Local
    provider: ollama
    model: qwen2.5-coder:1.5b-base
    apiBase: http://127.0.0.1:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 2048
      maxTokens: 128
      temperature: 0.2
    autocompleteOptions:
      maxPromptTokens: 1024
      debounceDelay: 250
